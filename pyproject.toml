[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "usertrail"
version = "0.1.0.dev0"
description = "Identity-centric Windows forensic timeline builder for EVTX and IIS logs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "UserTrail contributors" }]
keywords = ["forensics", "dfir", "evtx", "active-directory", "timeline", "iis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "evtx>=0.8",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    # Windows has no system IANA time zone database; zoneinfo needs this package there.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
usertrail = "usertrail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/usertrail"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Keep documentation snippets (and the spec in CLAUDE.md) exactly as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
# Hungarian report strings legitimately contain non-ASCII characters and dashes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# typer evaluates argument defaults such as typer.Option(...) at call time by design.
"src/usertrail/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["evtx", "evtx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
