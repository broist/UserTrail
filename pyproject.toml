[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "usertrail"
version = "0.1.1"
description = "Felhasználóközpontú Windows forensic idővonal-építő EVTX- és IIS-naplókhoz"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "A UserTrail közreműködői" }]
keywords = ["forensics", "dfir", "evtx", "active-directory", "timeline", "iis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "evtx>=0.8",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    # Windowson nincs rendszerszintű IANA-időzóna-adatbázis, ott a zoneinfo ezt a csomagot használja.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Önálló futtatható fájl építése (packaging/usertrail.spec).
exe = [
    "pyinstaller>=6.10",
]

[project.scripts]
usertrail = "usertrail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/usertrail"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# A dokumentáció kódrészletei (és a CLAUDE.md specifikációja) maradjanak változatlanok.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
# A magyar szövegekben jogosan szerepelnek ékezetes karakterek és gondolatjelek.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# A typer szándékosan hívásidőben értékeli ki a typer.Option(...) alapértékeket.
"src/usertrail/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["evtx", "evtx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
