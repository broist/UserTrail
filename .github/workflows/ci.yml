name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Telepítés
        run: python -m pip install -e ".[dev]"
      - name: Ruff ellenőrzés
        run: ruff check .
      - name: Ruff formázás
        run: ruff format --check .
      - name: Mypy típusellenőrzés
        run: mypy
      - name: Pytest tesztek
        run: pytest
